name: CI on PRs to master & patchmanager3 branches

on:
  pull_request:
    branches:
      - master
      - patchmanager3
  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  # Do not wait up to the default of 10 minutes for network timeouts in a workflow which runs ca. 5 minutes
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1

defaults:
  run:
    # Note thas 'bash' provides -o pipefail, in contrast to the default (i.e., unspecified, which also uses bash) or 'sh',
    # see https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsshell
    shell: sh

# See, e.g.: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-only-cancel-in-progress-jobs-or-runs-for-the-current-workflow
concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: false
  # 'false' (default) allows for two concurrent runs, one executing and one freshly enqueued; 'true' for only one; no 'concurrency:' defined for multiple.

jobs:
  build:
    name: Build test recent commit for PR from ${{ github.ref_type }} ${{ github.base_ref }} to ${{ github.head_ref }}
    runs-on: ubuntu-22.04
    env:
      # Solely builds for i486 on 3.4.0, because of https://github.com/sailfishos-patches/patchmanager/pull/437#issuecomment-1615317003
      ARCH: i486
      RELEASE: 3.4.0.24
    steps:

    - name: Checkout
      uses: actions/checkout@v3

    - name: Prepare
      run: mkdir -p output/$RELEASE/$ARCH

    # Caching Docker images is not ready yet, see 
    # https://github.com/storeman-developers/harbour-storeman-installer/blob/devel/cache-docker-images_github-ci.md
    #- name: Cache Docker images of the Sailfish-SDK
    #  id: cache-sdk
    #  uses: actions/cache@v3
    #  with:
    #    path: $GITHUB_WORKSPACE/…
    #    key: cache

    - name: Restore cache
      uses: actions/cache/restore@v3
      with:
        path: ~/.local/share/containers/storage/
        key: docker-CoderusSailfishosPlatformSDK-${{ env.RELEASE }}
        # Will likely create an avalanche effect, as various images and layers accumulate.
        #restore-keys: |
        #  docker-sfos_sdk-
        #  docker-

    - name: Build ${{ env.ARCH }} on ${{ env.RELEASE }}
      run: |
        set -x
        # Required to increase insufficient sub[ug]id ranges:
        subXid_range=100000
        me="$(whoami)"
        subuid_me="$(grep "^$me:" /etc/subuid)"
        subgid_me="$(grep "^$me:" /etc/subgid)"
        if [ $(echo -n "$subuid_me" | grep -c '.*') -ne 1 ] || [ $(echo -n "$subgid_me" | grep -c '.*') -ne 1 ]
        then exit 1
        fi
        if [ -n "$subXid_range" ] && [ "$subXid_range" -gt $(echo $subuid_me | cut -d : -f 3) ]
        then sudo sed -i "s/^$subuid_me\$/$me:$(echo $subuid_me | cut -d : -f 2):$subXid_range/" /etc/subuid
        fi
        if [ -n "$subXid_range" ] && [ "$subXid_range" -gt $(echo $subgid_me | cut -d : -f 3) ]
        then sudo sed -i "s/^$subgid_me\$/$me:$(echo $subgid_me | cut -d : -f 2):$subXid_range/" /etc/subgid
        fi
        podman system migrate
        # `podman system migrate` is neccesary when subuid or subgid ranges were altered, even if `podman` has not been started before.
        podman run --rm -v $PWD:/share docker.io/coderus/sailfishos-platform-sdk:$RELEASE /bin/sh -xc '
           mkdir -p build
           cd build
           cp -r /share/. .
           mb2 -t SailfishOS-$1-$2 build -d
           sudo cp -r RPMS/. /share/output/$1/$2/' sh_mb2 $RELEASE $ARCH
        # Note that .config/containers does not exist with Podman 3.4.4, even though it just ran.

    - name: Upload build results
      uses: actions/upload-artifact@v3
      with:
        name: RPM-build-results-${{ env.RELEASE }}-${{ env.ARCH }}
        path: output/

    - name: Save cache
      uses: actions/cache/save@v3
      with:
        path: ~/.local/share/containers/storage/
        key: docker-CoderusSailfishosPlatformSDK-${{ env.RELEASE }}

